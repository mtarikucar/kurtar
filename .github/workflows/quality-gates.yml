name: Quality Gates

# Lint + typecheck + unit tests + real-DB tests + migration hygiene, as a
# blocking gate. Runs on every PR and on push to main; release-deploy.yml
# (once a remote/secrets exist) is expected to `needs:` this workflow the
# same way kds's release-deploy.yml `uses: ./.github/workflows/quality-
# gates.yml` before it ever builds an image.

on:
  pull_request:
  push:
    branches: [main]
  # Lets release-deploy.yml `uses: ./.github/workflows/quality-gates.yml`
  # as its own blocking `quality` job — no image is ever built from a red
  # suite.
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'

jobs:
  # -----------------------------------------------------------------
  # Fast lane: lint + both tsconfigs + the mocked/unit suite. Runs with
  # NO TEST_DATABASE_URL set, which is exactly what proves every
  # *.realdb.spec.ts file's `describe.skip` gate (TEST_DATABASE_URL ?
  # describe : describe.skip — see backend/src/prisma/schema.realdb.
  # spec.ts and its 10 siblings) actually skips cleanly rather than
  # erroring, e.g. on a missing DB client.
  # -----------------------------------------------------------------
  backend-quality:
    name: Backend lint + typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Root lockfile — this is an npm workspace (root package.json
          # "workspaces": ["backend"]); backend/ has its own package.json
          # but no lockfile of its own.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Two tsconfigs give meaningfully different coverage: tsconfig.json
      # is the source-only surface `nest build` type-checks against;
      # tsconfig.eslint.json additionally includes test/**/* so *.spec.ts
      # files get checked too (tsconfig.build.json is a near-duplicate of
      # tsconfig.json for typecheck purposes — same excludes — so it adds
      # nothing a plain `npm run build` wouldn't already catch).
      - name: Typecheck (source)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (source + tests)
        run: npx tsc --noEmit -p tsconfig.eslint.json

      - name: Unit tests (no TEST_DATABASE_URL — realdb specs must skip cleanly)
        run: npm test

  # -----------------------------------------------------------------
  # Real Postgres/PostGIS + Redis. `prisma migrate deploy` (NOT `db
  # push`) so every migrations/*/migration.sql file — including the
  # hand-written GIST index and CHECK constraints — actually executes in
  # CI. A prior project (kds) shipped a prod incident because its CI used
  # `db push`, which builds the current schema shape directly and never
  # runs the real migration SQL, so a migration that was broken in
  # practice looked green in CI right up until the real prod deploy ran
  # it for the first time. `migrate deploy` is the only invocation that
  # proves the actual SQL kurtar will run in production.
  #
  # Concurrency choice — --runInBand (measured locally before this workflow
  # was written): reservations.realdb.spec.ts intentionally
  # requests connection_limit=60 on its own PrismaClient for its 50-
  # parallel-create oversell race test; several other realdb files open
  # their own PrismaClient (and, per file, sometimes a second one via a
  # hand-built Nest test harness) on top of that. Under Jest's default
  # full-parallel scheduling or even --maxWorkers=2, those pools can
  # overlap against the SAME Postgres instance and stack past whatever
  # max_connections the service container has (previously observed
  # first-hand during Task 5's local runs — see that task's report —
  # as a stray-row/cleanup failure traced back to exactly this
  # contention, though it did not reproduce deterministically). Locally
  # `--runInBand` ran the full 51-suite/447-test suite in ~11-12s across
  # 3 consecutive runs (vs ~6.5s for --maxWorkers=2) — a negligible cost
  # for a suite this size — with zero cross-file connection overlap by
  # construction (Jest runs files strictly sequentially in-band, so one
  # file's afterAll/$disconnect always completes before the next file's
  # beforeAll opens a new pool). That determinism, not raw speed, is why
  # this job uses --runInBand instead of a bounded --maxWorkers.
  # -----------------------------------------------------------------
  backend-realdb:
    name: Backend real-DB tests (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kurtar
          POSTGRES_PASSWORD: kurtar
          POSTGRES_DB: kurtar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kurtar -d kurtar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kurtar:kurtar@localhost:5432/kurtar_ci
      TEST_DATABASE_URL: postgresql://kurtar:kurtar@localhost:5432/kurtar_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (migrate deploy — real SQL, not db push)
        run: npx prisma migrate deploy

      # [B6] The "every migration has a down.sql" check in the
      # migrations-parity job below only proves the FILE exists — it never
      # proves the SQL inside it actually runs cleanly against a real,
      # fully-migrated database. This step does: revert every migration's
      # down.sql in reverse chronological order (undoing the `migrate
      # deploy` above, migration by migration), drop Prisma's own
      # `_prisma_migrations` ledger (untouched by any down.sql, by design —
      # see the init migration's down.sql note on why it never drops
      # postgis either), then redeploy every up from scratch. Dropping the
      # ledger is what makes the redeploy a genuine proof rather than a
      # no-op: with the ledger intact, `migrate deploy` would see every
      # migration already marked "applied" and skip re-running any of them,
      # silently leaving the database empty. Runs against the SAME service
      # container the full suite below then reuses, so a broken down.sql
      # fails this step loudly with a normal psql error instead of the
      # suite failing later with a much more confusing "table does not
      # exist".
      - name: Migration reversibility round-trip (revert every down.sql, then redeploy)
        run: |
          set -euo pipefail
          echo "Reverting every migration's down.sql, reverse chronological order..."
          mapfile -t dirs < <(printf '%s\n' prisma/migrations/*/ | sort -r)
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            [ "$name" = "migration_lock.toml" ] && continue
            down="${dir}down.sql"
            if [ -f "$down" ]; then
              echo "  - reverting ${name}"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$down"
            fi
          done
          echo "Dropping Prisma's migration ledger so 'migrate deploy' treats this as a fresh database..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c 'DROP TABLE IF EXISTS "_prisma_migrations";'
          echo "Redeploying every up migration from scratch..."
          npx prisma migrate deploy
          echo "Round-trip OK — every migration's down.sql is genuinely reversible."

      - name: Full test suite against real Postgres/PostGIS (--runInBand)
        run: npx jest --runInBand

  # -----------------------------------------------------------------
  # 1. Schema/migration parity — `prisma migrate diff` between what the
  #    migrations folder actually produces and what schema.prisma
  #    currently declares must be empty, catching a schema.prisma edit
  #    that never got a matching migration (ported from kds-marketing's
  #    ci.yml). The shadow DB must be PostGIS-enabled (not plain
  #    postgres:16-alpine, unlike kds-marketing which has no geo columns)
  #    because the init migration runs `CREATE EXTENSION postgis` itself.
  #
  #    One EXPECTED, permanent divergence: stores.location is a raw
  #    `Unsupported("geography(Point,4326)")` column (Prisma cannot
  #    express a GIST index natively — see schema.prisma's comment on
  #    Store.location) indexed by a hand-written
  #    `CREATE INDEX ... USING GIST` statement in the init migration.
  #    `migrate diff` always reports this one index as a divergence
  #    because schema.prisma has no way to declare it. The check below
  #    allows *exactly* that one expected statement through and fails
  #    loudly on anything else.
  #
  # 2. Reversibility — every migrations/*/ folder must ship a down.sql
  #    (project hard rule: every schema migration is an up/down pair).
  # -----------------------------------------------------------------
  migrations-parity:
    name: Migrations <-> schema parity + reversibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      shadow-db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shadow -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrations <-> schema.prisma diff
        run: |
          set -euo pipefail
          diff_out=$(npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://shadow:shadow@localhost:5433/shadow \
            --script)

          # Normalise (strip leading whitespace per line, drop blank lines)
          # before comparing against the one allowed statement — the SAME
          # transform applied to BOTH sides, so incidental indentation in
          # either the actual diff output or this script's own $allowed
          # heredoc can never mask a real divergence (or fail a benign
          # one) by comparing unlike-for-like.
          normalise() {
            printf '%s\n' "$1" | sed 's/^[[:space:]]*//; /^[[:space:]]*$/d'
          }
          normalised=$(normalise "$diff_out")
          allowed='-- DropIndex
          DROP INDEX "store_location_gist";'
          allowed_normalised=$(normalise "$allowed")

          if [ -z "$normalised" ]; then
            echo "Migrations and schema.prisma are in sync — no diff."
          elif [ "$normalised" = "$allowed_normalised" ]; then
            echo "Only the expected, documented divergence found (hand-written"
            echo "GIST index on stores.location — Prisma cannot express GIST"
            echo "indexes natively; see schema.prisma's comment on Store.location)."
            echo "$normalised"
          else
            echo "::error::Migrations and schema.prisma have diverged beyond the one known/expected exception."
            echo "Either schema.prisma changed without a matching migration, or a"
            echo "migration changed without schema.prisma being updated to match."
            echo "--- diff ---"
            echo "$normalised"
            exit 1
          fi

      - name: Every migration has a down.sql
        run: |
          set -euo pipefail
          missing=0
          for dir in prisma/migrations/*/; do
            name=$(basename "$dir")
            [ "$name" = "migration_lock.toml" ] && continue
            if [ ! -f "${dir}migration.sql" ]; then
              continue
            fi
            if [ ! -f "${dir}down.sql" ]; then
              echo "::error::${dir} is missing down.sql — every migration must be reversible."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Every migration folder has a down.sql."

  # -----------------------------------------------------------------
  # [Task 9] OpenAPI contract-drift — docs/openapi.json (the committed
  # spec Tasks 10-13's four frontends read as their contract) must always
  # be exactly what `npm run openapi:generate` produces from the current
  # source. Mirrors migrations-parity's own shape immediately above:
  # regenerate into a throwaway location, diff against the committed
  # file, fail loud on any divergence — a controller/DTO change that
  # forgot to re-run the generator is caught here instead of silently
  # shipping a stale contract to the frontend teams.
  #
  # Needs a reachable Postgres (PrismaService.onModuleInit eagerly
  # $connect()s during NestFactory.create, and Prisma's own client
  # requires DATABASE_URL to parse to a real connection string) — no
  # migrations need to be applied first, since building the OpenAPI
  # document never queries the database, only introspects route/DTO
  # metadata. Same postgis image as every other job for consistency,
  # even though PostGIS itself is never touched here.
  # -----------------------------------------------------------------
  openapi-contract-drift:
    name: OpenAPI contract drift (docs/openapi.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kurtar
          POSTGRES_PASSWORD: kurtar
          POSTGRES_DB: kurtar_openapi_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kurtar -d kurtar_openapi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://kurtar:kurtar@localhost:5434/kurtar_openapi_ci
      JWT_SECRET: openapi-ci-jwt-secret-32-chars-min
      WEBHOOK_SECRET: openapi-ci-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Regenerate docs/openapi.json and diff against the committed copy
        run: |
          set -euo pipefail
          cp ../docs/openapi.json /tmp/openapi.committed.json
          npm run openapi:generate
          if ! diff -u /tmp/openapi.committed.json ../docs/openapi.json; then
            echo "::error::docs/openapi.json is out of date — run 'npm run openapi:generate' in backend/ and commit the result."
            exit 1
          fi
          echo "docs/openapi.json matches the current source — no drift."

      # [Contract completion] The drift check above only proves the
      # COMMITTED file matches what the source currently generates — it
      # says nothing about whether that generated contract is actually
      # USABLE by a typed client. 65 of 81 operations had no response
      # schema at all until this pass (frontend-contract.md §9's finding,
      # which blocked Tasks 10-13's parallel frontend build); this step is
      # the tripwire so that gap can never silently reopen — every
      # operation must keep exactly one 2xx response with a real schema
      # (see check-openapi-response-types.ts's own doc comment for the
      # exact two failure classes it catches, including the "has *a*
      # schema but it's a vacuous {type:object}" trap that a naive
      # presence check would miss).
      - name: Every operation has exactly one typed 2xx response
        run: npm run openapi:check-response-types

  # -----------------------------------------------------------------
  # [Task 9.5] The four frontend apps (apps/merchant-web, apps/admin-web,
  # apps/consumer, landing) + the two shared packages (packages/api-client,
  # packages/ui-tokens). Needs no database/Redis service — @kurtar/
  # api-client's generated types come from the committed docs/openapi.json
  # file, not a live server, so this job stays fast and fully independent
  # of the backend-realdb job above.
  #
  # Build order matters: the two shared packages ship COMPILED dist/
  # output (see each package.json's `main`/`types` fields) — every app
  # imports that dist/ output, not their TS source, so both packages must
  # be built before any app is typechecked or built.
  # -----------------------------------------------------------------
  frontend-quality:
    name: Frontend lint + typecheck + unit tests + builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (every workspace)
        run: npm ci --no-audit --no-fund

      - name: api-client generated types <-> docs/openapi.json drift
        run: |
          set -euo pipefail
          cp packages/api-client/src/generated/openapi-types.ts /tmp/openapi-types.committed.ts
          npm run generate -w @kurtar/api-client
          if ! diff -u /tmp/openapi-types.committed.ts packages/api-client/src/generated/openapi-types.ts; then
            echo "::error::packages/api-client/src/generated/openapi-types.ts is out of date — run 'npm run generate -w @kurtar/api-client' and commit the result."
            exit 1
          fi
          echo "Generated types match docs/openapi.json — no drift."

      - name: Build @kurtar/ui-tokens
        run: npm run build -w @kurtar/ui-tokens

      - name: Build @kurtar/api-client
        run: npm run build -w @kurtar/api-client

      - name: Lint (every workspace)
        run: |
          set -euo pipefail
          npm run lint -w @kurtar/ui-tokens
          npm run lint -w @kurtar/api-client
          npm run lint -w merchant-web
          npm run lint -w admin-web
          npm run lint -w landing
          npm run lint -w consumer

      - name: Typecheck (every workspace)
        run: |
          set -euo pipefail
          npm run typecheck -w @kurtar/ui-tokens
          npm run typecheck -w @kurtar/api-client
          npm run typecheck -w merchant-web
          npm run typecheck -w admin-web
          npm run typecheck -w landing
          npm run typecheck -w consumer

      - name: Unit tests (@kurtar/api-client — incl. the single-flight refresh test)
        run: npm test -w @kurtar/api-client

      # Regression gate for a bug class that evaded both the two checks
      # above: openapi-typescript emits response-status keys as NUMERIC
      # literals, which a naive `K extends \`2${string}\`` conditional
      # type never matches — collapsing every domain method's COMPILED
      # return type to `Promise<never>` while `tsc --noEmit` on source
      # (the Typecheck step above) stayed green throughout, because the
      # checker fully resolves the conditional at a call site with
      # concrete literal arguments even when the declaration emitter,
      # printing an unannotated inferred return type, cannot. This step
      # rebuilds the package and typechecks a fixture
      # (test-types/build-output.types.ts) that imports the BUILT dist/
      # output — the same thing a real consumer's own tsc resolves
      # against — and asserts real fields exist on the awaited response
      # types. See core-types.ts's SuccessBody doc comment for the fix.
      - name: Type-level regression test against the BUILT @kurtar/api-client (not source)
        run: npm run typecheck:build -w @kurtar/api-client

      - name: Production build — merchant-web (vite build)
        run: npm run build -w merchant-web

      - name: Production build — admin-web (vite build)
        run: npm run build -w admin-web

      - name: Production build — landing (next build)
        run: npm run build -w landing

      # Expo gets expo-doctor + a typecheck (already run above), not a
      # native build — this job has no Xcode/Android SDK, and a native
      # build is a separate concern (EAS Build) from source-level quality.
      #
      # Mirrors migrations-parity's "one documented, allowed exception"
      # pattern above: expo-doctor has exactly TWO checks that can never
      # pass in this monorepo, both structural and both harmless, not
      # defects —
      #   1. "Metro config" flags metro.config.js's
      #      resolver.disableHierarchicalLookup override as risky. It's
      #      the fix, not a bug: Expo's own documented monorepo setup
      #      (https://docs.expo.dev/guides/monorepos/) requires exactly
      #      this override so Metro can find @kurtar/api-client and
      #      @kurtar/ui-tokens, which npm workspaces hoists/symlinks to
      #      the repo root's node_modules, not this app's own.
      #   2. "Duplicate dependencies" flags react/react-dom appearing at
      #      two versions in the tree — apps/merchant-web and apps/
      #      admin-web are deliberately pinned to React 18 (brief
      #      requirement), apps/consumer needs React 19 for its Expo SDK.
      #      The two never share a bundle or a native build target (npm
      #      already nests apps/consumer's own React 19 copy precisely
      #      because of this conflict), so this is a benign cross-
      #      workspace split, not an actual native-link collision.
      # Any OTHER finding fails this step loudly — only these two
      # specific, named checks are ever excused.
      - name: Expo — expo-doctor (apps/consumer)
        working-directory: apps/consumer
        run: |
          set -euo pipefail
          set +e
          output=$(npx expo-doctor 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "expo-doctor: all checks passed."
            exit 0
          fi
          failed_count=$(printf '%s\n' "$output" | grep -c '^✖ ')
          if [ "$failed_count" -eq 2 ] \
            && printf '%s\n' "$output" | grep -q 'Check for issues with Metro config' \
            && printf '%s\n' "$output" | grep -q 'Check that no duplicate dependencies are installed'; then
            echo "Only the two known, documented, cross-workspace findings are present — treating as pass."
            exit 0
          fi
          echo "::error::expo-doctor reported unexpected issues beyond the two documented exceptions above."
          exit 1

  # -----------------------------------------------------------------
  # [Task 14] Cross-surface E2E — the money loop, end to end, against a
  # real ephemeral Postgres/PostGIS + Redis, the real backend (built,
  # `node dist/main`, not `nest start --watch`), and the BUILT merchant-
  # web/admin-web (`vite preview`, not dev servers) — see
  # e2e/tests/money-loop.spec.ts's own doc comment for exactly what it
  # proves (consumer discovery -> reserve -> mock PSP webhook -> CONFIRMED
  # -> merchant-web pickup list -> redeem -> rating -> nightly settlement
  # batch -> admin-web approve -> retry/payout dispatch -> SENT) and why
  # the consumer side is driven via the real API rather than a browser
  # (the Expo app has no browser surface — see apps/consumer's own jest+
  # RNTL suite for that side instead).
  #
  # Timing (measured locally, `time npx playwright test` from e2e/):
  # the test itself is ~20s; this whole job (checkout, npm ci, Chromium
  # download, 4 production builds, backend boot+migrate+seed, then the
  # test) runs in ~3-4 minutes. Deliberately its own job (not folded into
  # frontend-quality or backend-realdb) so it can be skipped/rerun
  # independently and so a flake here never blocks the much faster unit-
  # test gates. Not required for a merge to be technically possible
  # (branch protection is configured outside this repo), but intended to
  # block real PRs the same way every other job here does.
  # -----------------------------------------------------------------
  e2e-money-loop:
    name: Cross-surface E2E (the money loop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kurtar
          POSTGRES_PASSWORD: kurtar
          POSTGRES_DB: kurtar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kurtar -d kurtar_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://kurtar:kurtar@localhost:5432/kurtar_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-ci-jwt-secret-32-characters-minimum
      WEBHOOK_SECRET: e2e-ci-webhook-secret
      KURTAR_API_PORT: 4750
      E2E_API_BASE_URL: http://localhost:4750
      E2E_MERCHANT_WEB_URL: http://localhost:5173
      E2E_ADMIN_WEB_URL: http://localhost:5174
      E2E_WEBHOOK_SECRET: e2e-ci-webhook-secret
      E2E_BACKEND_LOG_FILE: /tmp/kurtar-backend-e2e.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (every workspace)
        run: npm ci --no-audit --no-fund

      - name: Install Playwright's Chromium (+ OS deps)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations (prisma migrate deploy)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed demo data
        working-directory: backend
        run: npm run seed:demo

      - name: Build @kurtar/ui-tokens + @kurtar/api-client
        run: |
          npm run build -w @kurtar/ui-tokens
          npm run build -w @kurtar/api-client

      - name: Build backend, merchant-web, admin-web
        run: |
          npm run build -w backend
          npm run build -w merchant-web
          npm run build -w admin-web

      # Backed by `node dist/main` (start:prod), the real production
      # entrypoint — not `nest start --watch`. Backgrounded so later steps
      # in this SAME job can reach it; GitHub Actions runners keep a
      # backgrounded process alive across steps within one job.
      - name: Start backend (background, logging to E2E_BACKEND_LOG_FILE)
        working-directory: backend
        run: |
          nohup npm run start:prod > "$E2E_BACKEND_LOG_FILE" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4750/api/health && exit 0
            sleep 1
          done
          echo "::error::Backend did not become healthy in time"
          cat "$E2E_BACKEND_LOG_FILE"
          exit 1

      - name: Start merchant-web + admin-web (background, vite preview)
        run: |
          nohup npm run preview -w merchant-web > /tmp/merchant-web-preview.log 2>&1 &
          nohup npm run preview -w admin-web > /tmp/admin-web-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null && curl -sf http://localhost:5174 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::merchant-web/admin-web preview servers did not become healthy in time"
          cat /tmp/merchant-web-preview.log /tmp/admin-web-preview.log
          exit 1

      - name: Run the money-loop E2E test
        working-directory: e2e
        run: npx playwright test --reporter=list

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # -----------------------------------------------------------------
  # Project hard rule: zero AI/Claude traces in commit messages, ever.
  # Greps the commit range this workflow run covers (PR base..head, or
  # the pushed range on a plain push) rather than any single commit.
  # -----------------------------------------------------------------
  commit-hygiene:
    name: Commit message hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grep commit messages for AI/Claude traces
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
          fi

          # A brand-new branch's first push reports an all-zero `before`
          # SHA (not a valid ref) — and so does EVERY tag push, always,
          # since the tag ref itself didn't exist before (this matters
          # here: release-deploy.yml `uses:` this workflow as its own
          # `quality` job, triggered by a `v*.*.*` tag push). Falling back
          # to just the tip commit in that case would only re-check the
          # one commit the tag happens to point at, silently skipping
          # every other commit the release actually contains. Prefer the
          # range of commits on HEAD that aren't already reachable from
          # main instead — on a tag cut cleanly from main that range is
          # normally empty (those commits were already scanned by this
          # same workflow's own `push: branches: [main]` trigger when they
          # landed); it's non-empty exactly when there's something a prior
          # run hasn't already checked, which is exactly what's worth
          # checking here. Only fall back to the tip-commit-only check if
          # neither remote nor local main is resolvable at all.
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            range=""
            if git rev-parse --verify --quiet origin/main >/dev/null 2>&1; then
              range="origin/main..${head}"
            elif git rev-parse --verify --quiet main >/dev/null 2>&1; then
              range="main..${head}"
            fi

            messages=""
            if [ -n "$range" ]; then
              messages=$(git log --format='%H%n%B%n---' "$range" 2>/dev/null || true)
            fi
            if [ -z "$messages" ]; then
              messages=$(git log -1 --format='%H%n%B%n---' "$head")
            fi
          else
            messages=$(git log --format='%H%n%B%n---' "${base}..${head}")
          fi

          pattern='Co-Authored-By:|Generated with|Claude|Anthropic'
          if printf '%s\n' "$messages" | grep -Eiq "$pattern"; then
            echo "::error::A commit message contains a disallowed AI/Claude trace (project hard rule — zero AI/Claude traces in git history)."
            printf '%s\n' "$messages" | grep -EiC1 "$pattern"
            exit 1
          fi
          echo "Commit messages OK — no AI/Claude traces found."

          # The message grep above cannot see a committed file NAMED after an
          # AI assistant, which is how landing/CLAUDE.md once slipped this very
          # gate. Tracked filenames are part of the same hard rule.
          offenders=$(git ls-files | grep -Ei '(^|/)(CLAUDE|AGENTS|COPILOT|CURSOR)\.md$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::AI-assistant files are tracked (project hard rule — zero AI/Claude traces in the repo):"
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo "Tracked filenames OK — no AI-assistant files."
