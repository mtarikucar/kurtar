# Dev stack — just the backend's own dependencies (PostGIS + Redis). The
# backend itself and all four frontend apps run via their own native dev
# servers (`npm run dev` in backend/, apps/merchant-web, apps/admin-web,
# apps/consumer, landing) — nothing here changes for Task 9.5.
#
# API_BASE_URL convention (Task 9.5): every frontend app reads the API's
# origin from its own env var, all pointing at the same backend
# (http://localhost:4750 by default — this compose file doesn't run the
# api container; start it separately, e.g. `npm run dev -w backend`):
#   apps/merchant-web  VITE_API_BASE_URL         (Vite, .env.local)
#   apps/admin-web     VITE_API_BASE_URL         (Vite, .env.local)
#   apps/consumer      EXPO_PUBLIC_API_BASE_URL  (Expo, .env.local)
#   landing            NEXT_PUBLIC_API_BASE_URL  (Next, .env.local)
# See each app's .env.example and docs/frontend-contract.md for the full
# port table (dev + prod + staging) and the backend's matching
# CORS_ALLOWED_ORIGINS default (backend/src/main.ts).
name: kurtar-dev

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kurtar
      POSTGRES_PASSWORD: kurtar
      POSTGRES_DB: kurtar
    ports:
      - "127.0.0.1:4754:5432"
    volumes:
      - kurtar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurtar -d kurtar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:4755:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kurtar_pgdata:
