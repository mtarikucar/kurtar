name: kurtar-dev

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kurtar
      POSTGRES_PASSWORD: kurtar
      POSTGRES_DB: kurtar
    ports:
      - "127.0.0.1:4754:5432"
    volumes:
      - kurtar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurtar -d kurtar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:4755:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kurtar_pgdata:
