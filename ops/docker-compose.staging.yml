# Staging stack — same shape as ops/docker-compose.prod.yml, shifted +10
# to its own port block (4760-4765) and its own volume/network/container
# names, so staging and prod can run on the same shared VPS side by side
# without ever colliding.
#
# Port map:
#   4760 -> api
#   4761-4763 -> reserved
#   4764 -> db             (postgis, localhost-bound)
#   4765 -> redis          (localhost-bound)
#   4766 -> merchant-web   (Task 9.5)
#   4767 -> admin-web      (Task 9.5)
#   4768 -> landing        (Task 9.5)
#   4769 -> reserved
# The Expo consumer app is NOT deployed via this compose file — see
# ops/docker-compose.prod.yml's header comment (same reasoning: EAS, not
# a long-running server container).
#
# Required in ./.env.staging (see backend/.env.example for the full
# app-level variable list; POSTGRES_PASSWORD is compose-only). Retention
# for scripts/backup-database.sh staging backups is 3 days (vs 14 for
# prod) — staging data has no long-term recovery value.
#
# IMAGE_TAG has no default (${IMAGE_TAG:?...}, not ${IMAGE_TAG:-current}) —
# it must always be an explicit release version, the same tag release-
# deploy.yml's build job actually pushed. (A prior draft of this file
# defaulted to :current, a tag the build job never pushes — that would
# have silently broken `docker compose pull` the first time IMAGE_TAG was
# left unset, rather than failing loudly.)

name: kurtar-staging

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kurtar_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: kurtar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kurtar_staging
    volumes:
      - kurtar_pgdata_staging:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:4764:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurtar -d kurtar_staging"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kurtar_net_staging

  redis:
    image: redis:7-alpine
    container_name: kurtar_redis_staging
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:4765:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kurtar_net_staging

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/kurtar-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: kurtar_api_staging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    ports:
      - "4760:4750"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4750/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kurtar_net_staging

  # [Task 9.5] Same three images as ops/docker-compose.prod.yml, same
  # container-internal ports (4756/4757/4758 — each Dockerfile's own
  # EXPOSE), remapped to the staging host-port block. See that file's
  # comment on these services for the full rationale.
  merchant-web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/kurtar-merchant-web:${MERCHANT_WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    container_name: kurtar_merchant_web_staging
    restart: unless-stopped
    ports:
      - "4766:4756"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4756/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kurtar_net_staging

  admin-web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/kurtar-admin-web:${ADMIN_WEB_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    container_name: kurtar_admin_web_staging
    restart: unless-stopped
    ports:
      - "4767:4757"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4757/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kurtar_net_staging

  landing:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/kurtar-landing:${LANDING_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required}}
    container_name: kurtar_landing_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "4768:4758"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4758/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kurtar_net_staging

volumes:
  kurtar_pgdata_staging:

networks:
  kurtar_net_staging:
    name: kurtar_net_staging
